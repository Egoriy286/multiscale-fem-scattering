    - paragraph [ref=e697]: "$$B=\\frac{y_2-y_1}{x_2-x_1},\\quad x=\\ln t,\\quad y=\\Delta P;\\qquad (83)$$ $$\\varepsilon=\\frac{q}{4\\pi B},\\qquad k=\\frac{\\varepsilon\\mu}{h}.\\qquad (84),(85)$$"
