name: multiscale-fem-scattering

services:
  dolfinx-complex:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    image: multiscale-fem-scattering/dolfinx-complex:local
    init: true
    restart: unless-stopped
    working_dir: /workspace/multiscale-fem-scattering
    volumes:
      - type: bind
        source: .
        target: /workspace/multiscale-fem-scattering
    ports:
      - "127.0.0.1:8888:8888"
    environment:
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      PYVISTA_OFF_SCREEN: "true"
      MPLBACKEND: Agg
    shm_size: 512m
    healthcheck:
      test: ["CMD", "python3", "-c", "import dolfinx, gmsh, torch; from petsc4py import PETSc; import numpy as np; assert np.dtype(PETSc.ScalarType).kind == 'c'; torch.fft.rfft2(torch.ones(4, 4))"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s
    command:
      - --ServerApp.root_dir=/workspace/multiscale-fem-scattering
