name: multiscale-fem-scattering

services:
  dolfinx-complex:
    build: .devcontainer
    image: multiscale-fem-scattering/dolfinx-complex:local
    init: true
    working_dir: /workspace/multiscale-fem-scattering
    volumes:
      - type: bind
        source: .
        target: /workspace/multiscale-fem-scattering
    ports:
      - "127.0.0.1:8888:8888"
    environment:
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      PYVISTA_OFF_SCREEN: "true"
    shm_size: 512m
    command:
      - --ServerApp.root_dir=/workspace/multiscale-fem-scattering
